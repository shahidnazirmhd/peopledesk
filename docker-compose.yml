# PeopleDesk - local development infrastructure.
# Only PostgreSQL runs in Docker; the backend and frontend run on the host.
#
#   docker compose up -d postgres
#   docker compose stop postgres
#   docker compose logs -f postgres
#
# Values are read from a root-level .env file (copy .env.example to .env).
# Every variable has a default, so the file also works without one.

services:
  postgres:
    image: postgres:16-alpine
    container_name: peopledesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-employee_db}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppassword}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume: data survives `docker compose stop`, `down` and restarts.
      # Only `docker compose down -v` deletes it.
      - peopledesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  peopledesk_pgdata:
